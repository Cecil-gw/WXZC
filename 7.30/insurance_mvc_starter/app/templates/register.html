{% extends "base.html" %}

{% block title %}注册 - 保险营销系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-person-plus"></i> 用户注册</h4>
            </div>
            <div class="card-body p-4">
                <form id="register-form" action="/api/v1/auth/register" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required minlength="3" placeholder="至少 3 个字符">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="至少 6 个字符">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-medium">确认密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="再次输入密码">
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-person-plus"></i> 注册账号
                        </button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none">已有账号？立即登录</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
