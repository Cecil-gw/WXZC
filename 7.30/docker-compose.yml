# 保险精准营销系统 - Docker Compose 配置
version: '3.8'

services:
  app:
    build: .
    container_name: insurance-ai-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=prod
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=5000
      - DATABASE_URL=sqlite:///instance/insurance.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-prod-key-please}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_SECONDS=86400
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - MODEL_DIR=data/models
    volumes:
      - ./data:/app/data
      - ./instance:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/auth/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
