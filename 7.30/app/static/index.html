<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保险精准营销系统 - Insurance AI</title>
  <!-- P0-06：显式声明空 favicon，避免浏览器默认请求 /favicon.ico 触发 404，控制台保持干净 -->
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

  <!-- ========== 登录页 ========== -->
  <div id="login-page">
    <div class="login-container">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="text-center mb-3">保险精准营销系统</h4>
          <p class="text-muted text-center small">Insurance AI</p>
          <div id="login-error" class="alert alert-danger d-none"></div>
          <form id="login-form">
            <div class="mb-3">
              <label for="username" class="form-label">用户名</label>
              <input type="text" class="form-control" id="username" required autofocus>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">密码</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
          </form>
          <p class="text-center mt-2 small">
            <a href="#" id="show-register">注册新账号</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 注册页 ========== -->
  <div id="register-page" class="d-none">
    <div class="login-container">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="text-center mb-3">注册新账号</h4>
          <div id="register-error" class="alert alert-danger d-none"></div>
          <div id="register-success" class="alert alert-success d-none"></div>
          <form id="register-form">
            <div class="mb-3">
              <label for="reg-username" class="form-label">用户名</label>
              <input type="text" class="form-control" id="reg-username" required>
            </div>
            <div class="mb-3">
              <label for="reg-password" class="form-label">密码</label>
              <input type="password" class="form-control" id="reg-password" required>
            </div>
            <button type="submit" class="btn btn-success w-100">注 册</button>
          </form>
          <p class="text-center mt-2 small">
            <a href="#" id="show-login">返回登录</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== 主应用 ========== -->
  <div id="app-page" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Insurance AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto" id="nav-menu"></ul>
          <span class="navbar-text">
            <span id="current-user"></span>
            <button class="btn btn-sm btn-outline-light ms-2" id="btn-logout">退出</button>
          </span>
        </div>
      </div>
    </nav>
    <div class="container-fluid mt-3" id="app-content">
      <p class="text-muted">请从菜单选择功能。</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
